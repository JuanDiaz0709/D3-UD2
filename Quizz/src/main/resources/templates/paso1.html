<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Paso 1 - Datos</title></head>
<body>
    <h2>Paso 1: Perfil Deportivo</h2>
    <p style="color: red;" th:if="${error != null}" th:text="${error}"></p>
    
    <!-- El POST por defecto de este form va hacia el paso 2 -->
    <form method="post" action="/paso2">
		<input type="hidden" name="montura" th:value="${montura}">
		<input type="hidden" name="resolucion" th:value="${resolucion}">
        <label>Nombre:</label><br>
        <input type="text" name="jugador" th:value="${jugador}"><br><br>
        
        <label>Posición en el campo:</label><br>
        <select name="posicion">
            <option value="">Selecciona...</option>
            <option value="Defensa" th:selected="${posicion == 'Defensa'}">Defensa</option>
            <option value="Medio" th:selected="${posicion == 'Medio'}">Medio</option>
            <option value="Delantero" th:selected="${posicion == 'Delantero'}">Delantero</option>
        </select><br><br>

        <label>Nivel de juego:</label><br>
        <input type="radio" name="nivel" value="Amateur" th:checked="${nivel == 'Amateur'}"> Amateur<br>
        <input type="radio" name="nivel" value="Semiprofesional" th:checked="${nivel == 'Semiprofesional'}"> Semiprofesional<br><br>
        
        <button type="submit">Siguiente</button>
    </form>
</body>
</html>
